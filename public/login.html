<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Satellite — Acceso</title>
  <meta name="description" content="Panel de control Satellite — Iniciar sesión" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1D559A;
      --navy: #0E254E;
      --gray: #DFE1E7;
      --light-blue: #4F8FD9;
      --pale-blue: #DCEBFA;
      --slate: #64748B;
      --white: #FFFFFF;
      --green: #22A06B;
      --red: #D64545;
      --bg: #F0F4FA;
      --surface: #FFFFFF;
      --text-1: #0E254E;
      --text-2: #334E7A;
      --text-3: #64748B;
      --border: #DFE1E7;
      --border-md: #C3CEDF;
      --r: 14px;
      --r-sm: 10px;
      --shadow-card: 0 4px 32px rgba(14, 37, 78, .10), 0 1px 4px rgba(14, 37, 78, .06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(29, 85, 154, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 85, 154, .04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--navy) 0%, var(--blue) 50%, var(--light-blue) 100%);
    }

    .login-card {
      position: relative;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow-card);
      width: 100%;
      max-width: 420px;
      padding: 44px 40px 36px;
      animation: card-in .4s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }
    }

    .login-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 160px;
      height: auto;
      display: block;
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .satellite-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .satellite-brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.3px;
    }

    .satellite-brand-sub {
      font-size: 11px;
      color: var(--slate);
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    .login-heading {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 4px;
      letter-spacing: -0.4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--slate);
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: .2px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--slate);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background: #F7F9FC;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 10px 12px 10px 38px;
      color: var(--text-1);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }

    .form-input::placeholder {
      color: var(--slate);
      opacity: .7;
    }

    .form-input:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(29, 85, 154, .1);
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: var(--blue);
      color: var(--white);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .1px;
      border: none;
      border-radius: var(--r-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .15s, transform .1s, box-shadow .15s;
      margin-top: 8px;
    }

    .btn-login:hover:not(:disabled) {
      background: var(--light-blue);
      box-shadow: 0 4px 16px rgba(29, 85, 154, .25);
      transform: translateY(-1px);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(214, 69, 69, .07);
      border: 1px solid rgba(214, 69, 69, .2);
      border-radius: 8px;
      font-size: 13px;
      color: #B83232;
      margin-top: 14px;
      animation: fade-in .2s ease;
    }

    .login-error.show {
      display: flex;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .55s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .login-footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--slate);
      opacity: .7;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>

<body>

  <div class="login-card" role="main">

    <div class="login-logo-wrap">
      <img class="login-logo" src="/assets/safe-demo_logo-blc-Photoroom.png" alt="Safe Demo" draggable="false" />

      <div class="login-divider">
        <div class="satellite-brand">
          <span class="satellite-brand-name">Satellite</span>
          <span class="satellite-brand-sub">Panel de Control</span>
        </div>
      </div>
    </div>

    <h1 class="login-heading">Iniciar sesión</h1>
    <p class="login-sub">Accede con tu cuenta de administrador</p>

    <form id="loginForm" novalidate>

      <div class="form-group">
        <label class="form-label" for="inputEmail">Correo electrónico</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="14" height="10" rx="2" />
            <path d="M1 5l7 5 7-5" />
          </svg>
          <input type="email" id="inputEmail" class="form-input" placeholder="jose.hernandez@safe-demo.com"
            autocomplete="email" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="inputPassword">Contraseña</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="12" height="8" rx="2" />
            <path d="M5 7V5a3 3 0 016 0v2" />
          </svg>
          <input type="password" id="inputPassword" class="form-input" placeholder="••••••••"
            autocomplete="current-password" required />
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Ingresar
      </button>

      <div class="login-error" id="loginError" role="alert">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round">
          <circle cx="7" cy="7" r="6" />
          <path d="M7 4.5v3M7 9.5h.01" />
        </svg>
        <span id="loginErrorMsg">Credenciales incorrectas</span>
      </div>
    </form>

    <div class="login-footer">
      Satellite &mdash; Uso interno Safe Demo
    </div>

  </div>

  <script>

    fetch('/api/auth/me')
      .then(r => r.json())
      .then(data => { if (data.authenticated) location.href = '/'; })
      .catch(() => { });

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errBox = document.getElementById('loginError');
    const errMsg = document.getElementById('loginErrorMsg');
    const emailEl = document.getElementById('inputEmail');
    const passEl = document.getElementById('inputPassword');

    function setError(msg) {
      errMsg.textContent = msg;
      errBox.classList.add('show');
    }

    function clearError() {
      errBox.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const email = emailEl.value.trim();
      const password = passEl.value;

      if (!email || !password) {
        setError('Por favor completa todos los campos.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Verificando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (data.success) {
          btn.innerHTML = 'Acceso concedido...';
          setTimeout(() => { location.href = '/'; }, 300);
        } else {
          setError(data.message || 'Credenciales incorrectas.');
          btn.disabled = false;
          btn.innerHTML = 'Ingresar';
          passEl.value = '';
          passEl.focus();
        }
      } catch {
        setError('Error de conexión. Intenta de nuevo.');
        btn.disabled = false;
        btn.innerHTML = 'Ingresar';
      }
    });

    // Clear error on input
    [emailEl, passEl].forEach(el => el.addEventListener('input', clearError));
  </script>

</body>

</html>
